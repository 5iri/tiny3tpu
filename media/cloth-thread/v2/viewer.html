<!doctype html><meta charset="utf-8"><title>KC705 — VexRiscv + TPU / Cloth</title><style>*{box-sizing:border-box}body{margin:0;background:#11160e;color:#eaf3d6;font-family:Helvetica,Arial,sans-serif}.window{width:1100px;padding:24px 30px 20px}h1{font-size:32px;font-weight:400;margin:0 0 24px}.body{display:flex;gap:28px}img{width:512px;height:512px;image-rendering:pixelated}.panel{flex:1}.fps{font-size:70px;color:#dafa7b;margin:20px 0 8px}.rolling{font-size:21px;color:#aebf98;line-height:1.3}.details{font-size:22px;margin-top:35px;line-height:1.95;white-space:pre}.status{font-size:19px;color:#c0cbad;margin:12px 0}.scope{font-size:17px;color:#879776;margin-top:20px}</style><main class="window"><h1>KC705 / VEXRISCV + STABLEHLO</h1><div class="body"><img id="frame"><div class="panel"><div class="fps" id="fps">— FPS</div><div class="rolling">Measured completed frames<br>Rolling 16-frame window</div><div class="details" id="details"></div></div></div><p class="status" id="status">Connecting to board…</p><p class="scope">VexRiscv 100 MHz · on-board physics + TPU transforms · host pixels only</p></main><script>async function update(){try{const s=await(await fetch('state')).json();document.querySelector('#frame').src='data:image/png;base64,'+s.png;document.querySelector('#fps').textContent=s.age_seconds<5?s.fps.toFixed(2)+' FPS':'— FPS';document.querySelector('#details').textContent=`FPGA + CPU driver    ${s.fpga_compute_ms.toFixed(2)} ms\nUART + host wait     ${s.uart_and_host_wait_ms.toFixed(2)} ms\nHost render + PNG    ${s.host_render_ms.toFixed(2)} ms\nVerified frame          ${s.sequence}\nSimulated time         ${s.sim_time.toFixed(5)} s\nBoard physics            ${s.physics_ms.toFixed(1)} ms\nPhysics TPU calls        ${s.physics_backend_calls}\nSystem clock              ${s.clock_hz/1e6} MHz`.replaceAll('\\n','\n');document.querySelector('#status').textContent=s.message;window.lastFrame=s;}catch(e){document.querySelector('#status').textContent='Waiting for live renderer / board connection…'}setTimeout(update,150)}update();</script>
